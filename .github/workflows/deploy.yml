name: Deploy Frontend

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Type-check & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  deploy:
    name: Deploy to VPS
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: SSH deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            # Ensure proper permissions
            chown -R ooskills:ooskills /var/www/ooskills/ooskills-frontend

            su - ooskills -c '
              set -e
              cd /var/www/ooskills/ooskills-frontend
              # "git reset --hard" below erases any change made on the server that
              # was never committed. Refuse to deploy instead of losing work silently.
              if [ -n "$(git status --porcelain)" ]; then
                echo "ERROR: the server has changes that are not committed to git:"
                git status --porcelain
                echo "Deploying would erase them. Commit and push them first, then re-run this deploy."
                exit 1
              fi
              git fetch origin
              git reset --hard origin/main
              npm ci
              npm run build
            '

            # Restart frontend service
            systemctl restart ooskills-frontend

            # Wait and verify the service becomes active
            echo "Waiting for ooskills-frontend to be ready..."
            for i in {1..15}; do
              if systemctl is-active --quiet ooskills-frontend; then
                echo "ooskills-frontend is active and running!"
                exit 0
              fi
              sleep 1
            done

            echo "ERROR: ooskills-frontend failed to start after 15 seconds."
            systemctl status ooskills-frontend -l --no-pager
            journalctl -u ooskills-frontend -n 30 --no-pager
            exit 1
